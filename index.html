<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langit–Lupa (Mobile Ready)</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; font-family:'Pixelify Sans', sans-serif; overflow:hidden; }
body { display:flex; justify-content:center; align-items:center; background:#aed581; }
canvas { border:3px solid #333; border-radius:10px; image-rendering:pixelated; display:block; }
.overlay { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; flex-direction:column; background:rgba(0,0,0,0.7); color:#fff; text-align:center; }
button { padding:0.8vw 1.5vw; margin:0.5vw; border:none; border-radius:8px; cursor:pointer; background:#2ecc71; color:#fff; font-size:1.5vw; }
input { padding:0.5vw; margin:0.5vw; font-size:1.5vw; }
#scoreboard { position:absolute; top:1vw; left:1vw; background:rgba(0,0,0,0.7); color:#fff; padding:1vw 1.5vw; border-radius:1vw; font-size:1.5vw; text-align:left; }
#pauseBtn { position:absolute; top:1vw; right:1vw; background:#e67e22; font-family:'Pixelify Sans',sans-serif; font-size:1.5vw; padding:0.8vw 1.5vw; border:none; border-radius:1vw; cursor:pointer; }
#countdownOverlay { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; font-size:8vw; font-weight:bold; color:#fff; background:rgba(0,0,0,0.7); z-index:10; display:none; }
#gameOverScreen { width:80vw; max-width:400px; height:90vh; max-height:700px; top:50%; left:50%; transform:translate(-50%,-50%); position:absolute; display:none; justify-content:center; align-items:center; z-index:5; pointer-events:all; }
#gameOverScreen .gameOverContainer { width:60%; height:auto; background:rgba(0,0,0,0.8); padding:2vw; border-radius:2vw; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center; font-size:2vw; }
#touchControls, #touchControls2P { position:absolute; inset:0; display:none; pointer-events:none; }
.joystick { position:absolute; bottom:10%; width:20vw; max-width:120px; height:20vw; max-height:120px; border-radius:50%; background:rgba(0,0,0,0.3); touch-action:none; }
.stick { position:absolute; width:40%; height:40%; border-radius:50%; background:rgba(255,255,255,0.6); top:30%; left:30%; }
#actionBtn { position:absolute; bottom:10%; right:10%; width:15vw; max-width:80px; height:15vw; max-height:80px; border-radius:50%; background:rgba(255,0,0,0.5); touch-action:none; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="countdownOverlay">3</div>

<div id="homeScreen" class="overlay">
  <h1>Langit–Lupa</h1>
  <button onclick="showModeSelect()">Play</button>
</div>

<div id="modeScreen" class="overlay" style="display:none;">
  <h2>Select Mode</h2>
  <button onclick="setupGame(1)">1 Player</button>
  <button onclick="setupGame(2)">2 Players</button>
  <div id="nameInputs"></div>
  <button id="startBtn" onclick="startCountdown()" style="display:none;">Start</button>
</div>

<div id="scoreboard" style="display:none;"></div>
<button id="pauseBtn" style="display:none;" onclick="togglePause()">Pause (P)</button>

<div id="gameOverScreen">
  <div class="gameOverContainer"></div>
</div>

<!-- 1P Touch -->
<div id="touchControls">
  <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
  <div id="actionBtn"></div>
</div>

<!-- 2P Touch -->
<div id="touchControls2P">
  <div id="joystick1" class="joystick" style="left:5%; bottom:10%;"><div id="stick1" class="stick"></div></div>
  <div id="joystick2" class="joystick" style="right:5%; bottom:10%;"><div id="stick2" class="stick"></div></div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.font = "12px 'Pixelify Sans'";
ctx.textAlign = "left";
ctx.imageSmoothingEnabled = false;

let SCALE=1;
let SAFE_ZONE={x:20,y:40,width:360,height:620};

function resizeCanvas(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const aspectRatio = 9/16;
    let canvasWidth = vw;
    let canvasHeight = vw / aspectRatio;
    if(canvasHeight > vh){ canvasHeight = vh; canvasWidth = vh * aspectRatio; }

    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    SCALE = canvas.width / 400;
    SAFE_ZONE.x = 20 * SCALE;
    SAFE_ZONE.y = 40 * SCALE;
    SAFE_ZONE.width = canvas.width - 40*SCALE;
    SAFE_ZONE.height = canvas.height - 80*SCALE;

    // Joystick scaling
    document.querySelectorAll(".joystick").forEach(j=>{ j.style.width=`${20*SCALE}px`; j.style.height=`${20*SCALE}px`; });
    document.querySelectorAll(".stick").forEach(s=>{ s.style.width=`${40*SCALE}%`; s.style.height=`${40*SCALE}%`; });
    document.getElementById("actionBtn").style.width=`${15*SCALE}vw`; document.getElementById("actionBtn").style.height=`${15*SCALE}vw`;
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

// --- Detect Mobile ---
function isMobile(){ return /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent); }
function updateTouchVisibility(){
  if(isMobile()){
    if(mode===1) document.getElementById("touchControls").style.display="block";
    else if(mode===2) document.getElementById("touchControls2P").style.display="block";
  } else {
    document.getElementById("touchControls").style.display="none";
    document.getElementById("touchControls2P").style.display="none";
  }
}

// --- Joystick setup ---
let joystick=document.getElementById("joystick"), stick=document.getElementById("stick");
let j={active:false,startX:0,startY:0,moveX:0,moveY:0};
stick.addEventListener("touchstart",e=>{ j.active=true; const t=e.touches[0]; j.startX=t.clientX; j.startY=t.clientY; });
stick.addEventListener("touchmove",e=>{ if(!j.active)return; const t=e.touches[0]; let dx=t.clientX-j.startX; let dy=t.clientY-j.startY; const max=40; if(Math.hypot(dx,dy)>max){ const a=Math.atan2(dy,dx); dx=max*Math.cos(a); dy=max*Math.sin(a);} j.moveX=dx; j.moveY=dy; stick.style.transform=`translate(${dx}px,${dy}px)`; });
stick.addEventListener("touchend",e=>{ j.active=false; j.moveX=0; j.moveY=0; stick.style.transform="translate(0,0)"; });

// 2P Joysticks
let stick1=document.getElementById("stick1"), stick2=document.getElementById("stick2");
let j1={active:false,startX:0,startY:0,moveX:0,moveY:0}; let j2={active:false,startX:0,startY:0,moveX:0,moveY:0};
function setupJoystick(stick,joystickObj){ 
  stick.addEventListener("touchstart",e=>{ joystickObj.active=true; const t=e.touches[0]; joystickObj.startX=t.clientX; joystickObj.startY=t.clientY; });
  stick.addEventListener("touchmove",e=>{ if(!joystickObj.active)return; const t=e.touches[0]; let dx=t.clientX-joystickObj.startX; let dy=t.clientY-joystickObj.startY; const max=40; if(Math.hypot(dx,dy)>max){ const a=Math.atan2(dy,dx); dx=max*Math.cos(a); dy=max*Math.sin(a);} joystickObj.moveX=dx; joystickObj.moveY=dy; stick.style.transform=`translate(${dx}px,${dy}px)`; });
  stick.addEventListener("touchend",e=>{ joystickObj.active=false; joystickObj.moveX=0; joystickObj.moveY=0; stick.style.transform="translate(0px,0px)"; });
}
setupJoystick(stick1,j1); setupJoystick(stick2,j2);
</script>
</body>
</html>
