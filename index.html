<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langit–Lupa (Responsive)</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Pixelify Sans', sans-serif;
    background: #aed581;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    border: 3px solid #333;
    border-radius: 10px;
    background: #f0f0f0;
    image-rendering: pixelated;
    max-width: 95vw;
    max-height: 95vh;
    width: auto;
    height: auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.7);
    color: #fff;
    flex-direction: column;
    font-size: 2vw;
    text-align: center;
  }
  button {
    padding: 1vw 2vw;
    margin: 1vh;
    border: none;
    border-radius: 1vw;
    cursor: pointer;
    background: #2ecc71;
    color: white;
    font-size: 1.5vw;
  }
  input {
    padding: 0.5vw;
    margin: 0.5vh;
    font-size: 1.2vw;
  }
  #scoreboard {
    position: absolute;
    top: 1vh;
    left: 1vw;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 1vh 1vw;
    border-radius: 1vw;
    font-size: 1.2vw;
    text-align: left;
  }
  #pauseBtn {
    position: absolute;
    top: 1vh;
    right: 1vw;
    background: #e67e22;
    font-size: 1.2vw;
  }
  #countdownOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 10vw;
    font-weight: bold;
    color: #fff;
    background: rgba(0,0,0,0.7);
    z-index: 10;
    display: none;
  }
  #gameOverScreen {
    width: 90vw;
    max-width: 400px;
    aspect-ratio: 400/700;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    position: absolute;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 5;
    pointer-events: all;
  }
  #gameOverScreen .gameOverContainer {
    width: 80%;
    height: auto;
    background: rgba(0,0,0,0.8);
    padding: 2vh 2vw;
    border-radius: 1vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    font-size: 1.2vw;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="countdownOverlay">3</div>

<div id="homeScreen" class="overlay">
  <h1 class="pixelify-sans-unique">Langit–Lupa</h1>
  <button onclick="showModeSelect()">Play</button>
</div>

<div id="modeScreen" class="overlay" style="display:none;">
  <h2 class="pixelify-sans-unique">Select Mode</h2>
  <button onclick="setupGame(1)">1 Player</button>
  <button onclick="setupGame(2)">2 Players</button>
  <div id="nameInputs"></div>
  <button id="startBtn" onclick="startCountdown()" style="display:none;">Start</button>
</div>

<div id="scoreboard" style="display:none;"></div>
<button id="pauseBtn" style="display:none;" onclick="togglePause()">Pause (P)</button>

<div id="gameOverScreen">
  <div class="gameOverContainer">
    <h2 id="gameOverMessage" class="pixelify-sans-unique">Game Over</h2>
    <p>Press <b>R</b> to Play Again</p>
    <p>Press <b>N</b> for New Player</p>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.font = "12px 'Pixelify Sans'";
ctx.textAlign = "left";
ctx.imageSmoothingEnabled = false;

// --- Responsive Canvas Scaling ---
function resizeCanvas() {
  const aspect = 400 / 700; // original ratio
  let w = window.innerWidth * 0.95;
  let h = window.innerHeight * 0.95;
  if (w / h > aspect) w = h * aspect;
  else h = w / aspect;
  canvas.width = 400;  // fixed internal resolution
  canvas.height = 700;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// --- The rest of your game logic stays the same ---
// Player images, tagger images, stones, platforms, game loop, draw(), update(), input handlers, etc.
// Just use the same code as you have for your Langit–Lupa game
</script>
</body>
</html>
