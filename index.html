<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Langit–Lupa Responsive Multi-Round</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
  margin:0; padding:0; height:100%; width:100%;
  font-family: 'Pixelify Sans', sans-serif;
  background:#aed581; overflow:hidden;
}
canvas {
  border:3px solid #333; border-radius:10px;
  background:#f0f0f0; image-rendering: pixelated;
  max-width:100%; max-height:90vh;
  display:block; margin:auto;
}
.overlay {
  position:absolute; inset:0;
  display:flex; justify-content:center; align-items:center;
  flex-direction:column; background:rgba(0,0,0,0.7); color:#fff;
  font-size:20px; text-align:center;
}
button {
  padding:10px 20px; margin:10px; border:none; border-radius:8px;
  cursor:pointer; background:#2ecc71; color:white; font-size:18px;
}
input { padding:8px; margin:5px; font-size:16px; }
#scoreboard {
  position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7);
  color:white; padding:12px 16px; border-radius:12px; font-size:14px; text-align:left;
}
#pauseBtn {
  position:absolute; top:10px; right:10px; background:#e67e22;
  font-family: 'Pixelify Sans', sans-serif;
}
#countdownOverlay {
  position:absolute; inset:0; display:flex; justify-content:center; align-items:center;
  font-size:72px; font-weight:bold; color:#fff; background: rgba(0,0,0,0.7); z-index:10; display:none;
}
#gameOverScreen {
  width:90%; max-width:400px; height:60%; max-height:600px;
  top:50%; left:50%; transform:translate(-50%,-50%);
  position:absolute; display:none; justify-content:center; align-items:center; z-index:5;
}
#gameOverScreen .gameOverContainer {
  width:100%; height:100%; background:rgba(0,0,0,0.85);
  border-radius:12px; display:flex; flex-direction:column; justify-content:center; align-items:center;
  color:white; text-align:center; font-size:18px;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="700"></canvas>

<div id="countdownOverlay">3</div>

<!-- Home Screen -->
<div id="homeScreen" class="overlay">
  <h1>Langit–Lupa</h1>
  <button onclick="showModeSelect()">Play</button>
</div>

<!-- Mode Select -->
<div id="modeScreen" class="overlay" style="display:none;">
  <h2>Select Mode</h2>
  <button onclick="setupGame(1)">1 Player</button>
  <button onclick="setupGame(2)">2 Players</button>
  <div id="nameInputs"></div>
  <button id="startBtn" onclick="startCountdown()" style="display:none;">Start</button>
</div>

<!-- Scoreboard -->
<div id="scoreboard" style="display:none;"></div>
<button id="pauseBtn" style="display:none;" onclick="togglePause()">Pause (P)</button>

<!-- Game Over Screen -->
<div id="gameOverScreen">
  <div class="gameOverContainer"></div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.font="12px Pixelify Sans"; ctx.textAlign="left"; ctx.imageSmoothingEnabled=false;

const PLAYER_FRAMES = 24, TAGGER_FRAMES=24, STONE_FRAMES=16, SCALE=1.5;
const SAFE_ZONE={x:40,y:80,width:canvas.width-80,height:canvas.height-120};

const playerImg = new Image(); playerImg.src="player.png";
const taggerImg = new Image(); taggerImg.src="tagger.png";
const stoneImg = new Image(); stoneImg.src="stone.png";
const bgImg = new Image(); bgImg.src="place.png";

let players=[], npc=null, gameRunning=false, paused=false, mode=1, timeSurvived=0;
let lastMode=1, lastNames=[], round=1, roundsHistory=[];
let platformTimer=0, platformInterval=600, platformCountdown=platformInterval, platforms=[];

// --- Platforms ---
function randomizePlatforms(){
  platforms=[]; const maxAttempts=100;
  for(let i=0;i<5;i++){
    let newPlat=null, safe=false, attempts=0;
    while(!safe&&attempts<maxAttempts){
      newPlat={x:SAFE_ZONE.x+Math.floor(Math.random()*(SAFE_ZONE.width-80)), y:SAFE_ZONE.y+Math.floor(Math.random()*(SAFE_ZONE.height-40)), w:80, h:40, frame:Math.floor(Math.random()*STONE_FRAMES)};
      safe=platforms.every(pl=>Math.abs(pl.x-newPlat.x)>60&&Math.abs(pl.y-newPlat.y)>60);
      attempts++;
    }
    if(newPlat) platforms.push(newPlat);
  }
}

// --- UI ---
function showModeSelect(){ document.getElementById("homeScreen").style.display="none"; document.getElementById("modeScreen").style.display="flex";}
function setupGame(numPlayers){
  mode=numPlayers; lastMode=numPlayers; const container=document.getElementById("nameInputs"); container.innerHTML="";
  document.getElementById("startBtn").style.display="block";
  if(numPlayers===1){ container.innerHTML=`Player Name: <input id="player1Name" placeholder="Player">`; }
  else{ container.innerHTML=`Player1: <input id="player1Name" placeholder="Player1"><br>Player2: <input id="player2Name" placeholder="Player2">`; }
}
function startCountdown(){
  const overlay=document.getElementById("countdownOverlay"); let count=3;
  overlay.textContent=count; overlay.style.display="flex";
  const interval=setInterval(()=>{
    count--; if(count===0) overlay.textContent="Go!";
    else if(count<0){ overlay.style.display="none"; clearInterval(interval); startGame(); }
    else overlay.textContent=count;
  },1000);
}

// --- Game Start ---
function startGame(){
  if(mode===1){
    let name=document.getElementById("player1Name").value||"Player";
    players=[{name,x:150,y:570,isTaya:false,score:0,frame:0,moving:false}];
    npc={x:250,y:570,isTaya:true,frame:0};
    lastNames=[name];
  } else {
    let name1=document.getElementById("player1Name").value||"Player1";
    let name2=document.getElementById("player2Name").value||"Player2";
    players=[{name:name1,x:120,y:570,isTaya:false,score:0,frame:0,moving:false,survived:0},
             {name:name2,x:260,y:570,isTaya:true,score:0,frame:0,moving:false,survived:0}];
    lastNames=[name1,name2];
  }
  randomizePlatforms(); round=1; roundsHistory=[];
  document.getElementById("modeScreen").style.display="none";
  document.getElementById("pauseBtn").style.display="block";
  document.getElementById("scoreboard").style.display="block";
  gameRunning=true; requestAnimationFrame(gameLoop);
}

// --- Input ---
const keys={}; const speed=3;
document.addEventListener("keydown",e=>{ keys[e.code]=true;
  if(!gameRunning&&document.getElementById("gameOverScreen").style.display==="flex"){ if(e.code==="KeyR") replayGame(); if(e.code==="KeyN") newPlayer(); }
  if(e.code==="KeyP"&&gameRunning) togglePause();
});
document.addEventListener("keyup",e=>keys[e.code]=false);

// --- Movement ---
function movePlayers(){
  players.forEach((p,i)=>{
    p.moving=false;
    if(i===0){ if(keys["KeyA"]){p.x-=speed;p.moving=true;} if(keys["KeyD"]){p.x+=speed;p.moving=true;} if(keys["KeyW"]){p.y-=speed;p.moving=true;} if(keys["KeyS"]){p.y+=speed;p.moving=true;} }
    if(mode===2&&i===1){ if(keys["ArrowLeft"]){p.x-=speed;p.moving=true;} if(keys["ArrowRight"]){p.x+=speed;p.moving=true;} if(keys["ArrowUp"]){p.y-=speed;p.moving=true;} if(keys["ArrowDown"]){p.y+=speed;p.moving=true;} }
    const frameW=playerImg.width/PLAYER_FRAMES; const frameH=playerImg.height;
    if(p.x<SAFE_ZONE.x)p.x=SAFE_ZONE.x; if(p.y<SAFE_ZONE.y)p.y=SAFE_ZONE.y;
    if(p.x+frameW*SCALE>SAFE_ZONE.x+SAFE_ZONE.width)p.x=SAFE_ZONE.x+SAFE_ZONE.width-frameW*SCALE;
    if(p.y+frameH*SCALE>SAFE_ZONE.y+SAFE_ZONE.height)p.y=SAFE_ZONE.y+SAFE_ZONE.height-frameH*SCALE;
  });
}

// --- Collision ---
function checkCollision(a,b){
  const aW=playerImg.width/PLAYER_FRAMES*SCALE, aH=playerImg.height*SCALE;
  const bW=playerImg.width/PLAYER_FRAMES*SCALE, bH=playerImg.height*SCALE;
  return a.x<a.x+bW && a.x+aW>b.x && a.y<a.y+bH && a.y+aH>b.y;
}

// --- Platform Check ---
function isOnPlatform(p){
  const frameW=playerImg.width/PLAYER_FRAMES, frameH=playerImg.height;
  return platforms.some(pl=>p.x+frameW*SCALE>pl.x && p.x<pl.x+pl.w && p.y+frameH*SCALE>pl.y && p.y+frameH*SCALE<pl.y+pl.h);
}

// --- Update ---
function update(){
  movePlayers();
  players.forEach(p=>p.frame=p.moving?(p.frame+0.25)%PLAYER_FRAMES:0);

  if(mode===1 && npc){
    let p=players[0]; if(!isOnPlatform(p)){ if(p.x<npc.x) npc.x-=2; if(p.x>npc.x) npc.x+=2; if(p.y<npc.y) npc.y-=2; if(p.y>npc.y) npc.y+=2; npc.frame=(npc.frame+0.25)%TAGGER_FRAMES;
      if(checkCollision(p,npc)) gameOver(`${p.name} got tagged!`);
    }
    timeSurvived++;
  } else if(mode===2){
    let p1=players[0], p2=players[1];
    if(checkCollision(p1,p2)){ let caught=p1.isTaya?p2:p1; gameOver(`${caught.name} got tagged!`, caught.isTaya?p2.name:p1.name);}
  }

  platformTimer++; platformCountdown=Math.max(0,platformInterval-platformTimer);
  if(platformTimer>=platformInterval){ randomizePlatforms(); platformTimer=0; platformInterval=Math.max(120,platformInterval-60); platformCountdown=platformInterval; }
}

// --- Game Over ---
function gameOver(msg, winner=""){
  gameRunning=false; document.getElementById("pauseBtn").style.display="none";
  const container=document.querySelector("#gameOverScreen .gameOverContainer");
  if(mode===1){
    container.innerHTML=`<h2>Game Over</h2><p>${msg}</p><button onclick="replayGame()">Play Again</button>`;
  } else {
    container.innerHTML=`<h2>Round ${round} Over</h2><p>${msg}</p>`;
    if(winner) container.innerHTML+=`<p>Winner: ${winner}</p>`;
    container.innerHTML+=`<button onclick="nextRound()">Continue</button><button onclick="newPlayer()">Quit</button>`;
  }
  document.getElementById("gameOverScreen").style.display="flex";
}

// --- Next Round ---
function nextRound(){ round++; startGame(); }
function replayGame(){ startGame(); }
function newPlayer(){ document.getElementById("gameOverScreen").style.display="none"; showModeSelect(); }
function togglePause(){ paused=!paused; document.getElementById("pauseBtn").textContent=paused?"Resume (P)":"Pause (P)"; if(!paused) requestAnimationFrame(gameLoop); }

// --- Draw ---
function drawSprite(img, frame, frames, dx, dy, scale){
  const frameW=img.width/frames, frameH=img.height;
  ctx.drawImage(img, Math.floor(frame)*frameW,0,frameW,frameH,dx,dy,frameW*scale,frameH*scale);
}
CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ if(w<2*r)r=w/2;if(h<2*r)r=h/2;this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath(); return this; }

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bgImg,0,0,canvas.width,canvas.height);
  platforms.forEach(pl=>{ const cols=4, frameW=stoneImg.width/cols, frameH=stoneImg.height/cols, sx=(pl.frame%cols)*frameW, sy=Math.floor(pl.frame/cols)*frameH; ctx.drawImage(stoneImg,sx,sy,frameW,frameH,pl.x,pl.y,pl.w,pl.h); });
  const barX=SAFE_ZONE.x, barY=SAFE_ZONE.y-20, barWidth=SAFE_ZONE.width, barHeight=12, radius=6, remaining=Math.max(0,platformCountdown/platformInterval);
  const gradient=ctx.createLinearGradient(barX,barY,barX+barWidth,barY); gradient.addColorStop(0,"red"); gradient.addColorStop(0.5,"yellow"); gradient.addColorStop(1,"green");
  ctx.fillStyle="#333"; ctx.beginPath(); ctx.roundRect(barX,barY,barWidth,barHeight,radius); ctx.fill();
  ctx.fillStyle=gradient; ctx.beginPath(); ctx.roundRect(barX,barY,barWidth*remaining,barHeight,radius); ctx.fill();
  ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(barX,barY,barWidth,barHeight,radius); ctx.stroke();
  players.forEach(p=>{ drawSprite(p.isTaya?taggerImg:playerImg,p.frame,TAGGER_FRAMES,p.x,p.y,SCALE); ctx.fillStyle=p.isTaya?"red":"blue"; ctx.fillText(p.name,p.x,p.y-8); });
  if(npc){ drawSprite(taggerImg,npc.frame,TAGGER_FRAMES,npc.x,npc.y,SCALE); ctx.fillStyle="red"; ctx.fillText("Taya",npc.x,npc.y-8); }

  // Scoreboard
  let html="<b>Scoreboard</b><br>";
  if(mode===1) html+=`${players[0].name}: Survived ${(timeSurvived/60).toFixed(1)}s`;
  else { html+="Press E to end<br>"; players.forEach(p=>html+=`${p.name}: ${(p.survived/60).toFixed(1)}s ${p.isTaya?"(Taya)":""}<br>`); }
  document.getElementById("scoreboard").innerHTML=html;
}

// --- Main Loop ---
function gameLoop(){ if(!gameRunning||paused) return; update(); draw(); requestAnimationFrame(gameLoop); }

</script>
</body>
</html>
